name: Build JSON Chunk Splitter

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --break-system-packages pyinstaller

      - name: Build .exe
        working-directory: app
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "JSON Chunk Splitter" `
            --icon "assets/icon.ico" `
            --add-data "assets;assets" `
            main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: split-database-windows
          path: app/dist/JSON Chunk Splitter.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install create-dmg
        run: |
          brew install create-dmg

      - name: Install PyInstaller
        run: python3 -m pip install --break-system-packages pyinstaller

      - name: Ensure icon.icns exists
        working-directory: app
        run: |
          mkdir -p assets
          if [ ! -f "assets/icon.icns" ]; then
            if [ -f "assets/icon.png" ]; then
              echo "Generating icon.icns from assets/icon.png..."
              mkdir -p icon.iconset
              sips -z 16 16     assets/icon.png --out icon.iconset/icon_16x16.png
              sips -z 32 32     assets/icon.png --out icon.iconset/icon_16x16@2x.png
              sips -z 32 32     assets/icon.png --out icon.iconset/icon_32x32.png
              sips -z 64 64     assets/icon.png --out icon.iconset/icon_32x32@2x.png
              sips -z 128 128   assets/icon.png --out icon.iconset/icon_128x128.png
              sips -z 256 256   assets/icon.png --out icon.iconset/icon_128x128@2x.png
              sips -z 256 256   assets/icon.png --out icon.iconset/icon_256x256.png
              sips -z 512 512   assets/icon.png --out icon.iconset/icon_256x256@2x.png
              sips -z 512 512   assets/icon.png --out icon.iconset/icon_512x512.png
              sips -z 1024 1024 assets/icon.png --out icon.iconset/icon_512x512@2x.png
              iconutil -c icns icon.iconset -o assets/icon.icns
              rm -rf icon.iconset
            elif [ -f "assets/icon.ico" ]; then
              echo "Generating icon.icns from assets/icon.ico..."
              sips -s format png assets/icon.ico --out assets/temp_icon.png
              mkdir -p icon.iconset
              sips -z 128 128 assets/temp_icon.png --out icon.iconset/icon_128x128.png
              sips -z 256 256 assets/temp_icon.png --out icon.iconset/icon_256x256.png
              sips -z 512 512 assets/temp_icon.png --out icon.iconset/icon_512x512.png
              iconutil -c icns icon.iconset -o assets/icon.icns
              rm -rf icon.iconset assets/temp_icon.png
            fi
          fi

      - name: Build .app and .dmg
        working-directory: app
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: split-database-macos
          path: app/dist/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system Tk + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk fuse libfuse2

      - name: Install PyInstaller
        run: python3 -m pip install --break-system-packages pyinstaller

      - name: Build AppImage
        working-directory: app
        run: |
          chmod +x build_linux_appimage.sh
          ./build_linux_appimage.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: split-database-linux
          path: app/dist/*.AppImage