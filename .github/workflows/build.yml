name: Build JSON Chunk Splitter

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --break-system-packages pyinstaller

      - name: Build .exe
        working-directory: app
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name "JSON Chunk Splitter" `
            --icon "assets/icon.ico" `
            --add-data "assets;assets" `
            main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: split-database-windows
          path: app/dist/JSON Chunk Splitter.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean Homebrew tap trust cache
        run: |
          brew untap --force homebrew/cask 2>/dev/null || true
          brew update --preinstall || true

      - name: Install python-tk and create-dmg
        run: |
          brew install python-tk@3.12 create-dmg

      - name: Install PyInstaller
        run: python3 -m pip install --break-system-packages pyinstaller

      - name: Build .app and .dmg
        working-directory: app
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: split-database-macos
          path: app/dist/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system Tk + build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk fuse libfuse2

      - name: Install PyInstaller
        run: python3 -m pip install --break-system-packages pyinstaller

      - name: Build AppImage
        working-directory: app
        run: |
          chmod +x build_linux_appimage.sh
          ./build_linux_appimage.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: split-database-linux
          path: app/dist/*.AppImage
